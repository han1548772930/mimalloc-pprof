# Manual, artifact-only measurement for #438. The experiment and validation live
# in ci/bench_arena_reclaim.py; this workflow contains no benchmark logic.
name: benchmark-arena-reclaim

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Measure paired runs
        run: python3 ci/bench_arena_reclaim.py --measure --toolchain unix --build-root "$RUNNER_TEMP/arena-build" --data "$RUNNER_TEMP/arena-reclaim-linux.json" --runs 3
      - uses: actions/upload-artifact@v4
        with:
          name: arena-reclaim-linux
          path: ${{ runner.temp }}/arena-reclaim-linux.json

  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Measure with Microsoft's native cl
        shell: bash
        run: python ci/bench_arena_reclaim.py --measure --toolchain msvc --build-root "$RUNNER_TEMP/arena-build" --data "$RUNNER_TEMP/arena-reclaim-msvc.json" --runs 3
      - uses: actions/upload-artifact@v4
        with:
          name: arena-reclaim-msvc
          path: ${{ runner.temp }}/arena-reclaim-msvc.json

  windows-gnu:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python
      - name: Measure with MinGW-w64
        shell: msys2 {0}
        run: python ci/bench_arena_reclaim.py --measure --toolchain mingw --build-root "$RUNNER_TEMP/arena-build" --data "$RUNNER_TEMP/arena-reclaim-mingw.json" --runs 3
      - uses: actions/upload-artifact@v4
        with:
          name: arena-reclaim-mingw
          path: ${{ runner.temp }}/arena-reclaim-mingw.json
