# Manual, artifact-only measurement for #438. The experiment and validation live
# in ci/bench_arena_reclaim.py; this workflow contains no benchmark logic.
name: benchmark-arena-reclaim

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/bench_arena_reclaim.*'
      - '.github/workflows/benchmark-arena-reclaim.yml'

permissions:
  contents: read

env:
  # A pull_request checkout uses a synthetic merge commit; pin the real head
  # instead so the benchmark source remains fetchable after the PR is merged.
  BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: d5bdb464debf59d0816eeac038d9d4423736c9c4
          path: baseline-main
      - name: Measure paired runs
        run: |
          python3 ci/bench_arena_reclaim.py --measure --toolchain unix --build-root "$RUNNER_TEMP/arena-build-pr" --data "$RUNNER_TEMP/arena-reclaim-linux-pr.json" --runs 3
          python3 ci/bench_arena_reclaim.py --measure --toolchain unix --build-root "$RUNNER_TEMP/arena-build-main" --allocator-source baseline-main --allocator-source-sha d5bdb464debf59d0816eeac038d9d4423736c9c4 --data "$RUNNER_TEMP/arena-reclaim-linux-main.json" --runs 3
      - uses: actions/upload-artifact@v4
        with:
          name: arena-reclaim-linux
          path: ${{ runner.temp }}/arena-reclaim-linux-*.json

  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: d5bdb464debf59d0816eeac038d9d4423736c9c4
          path: baseline-main
      - name: Measure with Microsoft's native cl
        shell: bash
        run: |
          python ci/bench_arena_reclaim.py --measure --toolchain msvc --build-root "$RUNNER_TEMP/arena-build-pr" --data "$RUNNER_TEMP/arena-reclaim-msvc-pr.json" --runs 3
          python ci/bench_arena_reclaim.py --measure --toolchain msvc --build-root "$RUNNER_TEMP/arena-build-main" --allocator-source baseline-main --allocator-source-sha d5bdb464debf59d0816eeac038d9d4423736c9c4 --data "$RUNNER_TEMP/arena-reclaim-msvc-main.json" --runs 3
      - uses: actions/upload-artifact@v4
        with:
          name: arena-reclaim-msvc
          path: ${{ runner.temp }}/arena-reclaim-msvc-*.json

  windows-gnu:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: d5bdb464debf59d0816eeac038d9d4423736c9c4
          path: baseline-main
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python
      - name: Measure with MinGW-w64
        shell: msys2 {0}
        run: |
          python ci/bench_arena_reclaim.py --measure --toolchain mingw --build-root "$RUNNER_TEMP/arena-build-pr" --data "$RUNNER_TEMP/arena-reclaim-mingw-pr.json" --runs 3
          python ci/bench_arena_reclaim.py --measure --toolchain mingw --build-root "$RUNNER_TEMP/arena-build-main" --allocator-source baseline-main --allocator-source-sha d5bdb464debf59d0816eeac038d9d4423736c9c4 --data "$RUNNER_TEMP/arena-reclaim-mingw-main.json" --runs 3
      - uses: actions/upload-artifact@v4
        with:
          name: arena-reclaim-mingw
          path: ${{ runner.temp }}/arena-reclaim-mingw-*.json
