<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
<rect width="960" height="480" fill="#fff"/>
<text x="36" y="36" font-size="22" font-family="sans-serif">Arena reclaim: cost and incremental savings</text>
<text x="36" y="58" font-size="12" font-family="sans-serif">Linux-6.17.0-1022-azure-x86_64-with-glibc2.39 · 10521b6cf6a3 · median of 3 paired runs</text>
<text x="45" y="100" font-size="16" font-family="sans-serif">Additional RSS reduction</text><text x="780" y="100" fill="#075aa6" font-size="19" font-family="sans-serif">15.9 MiB</text>
<text x="45" y="148" font-size="16" font-family="sans-serif">Additional private reduction</text><text x="780" y="148" fill="#075aa6" font-size="19" font-family="sans-serif">16.0 MiB</text>
<text x="45" y="196" font-size="16" font-family="sans-serif">Additional allocator commit reduction</text><text x="780" y="196" fill="#075aa6" font-size="19" font-family="sans-serif">256.4 MiB</text>
<text x="45" y="244" font-size="16" font-family="sans-serif">Virtual arena reservation released (not RSS)</text><text x="780" y="244" fill="#777" font-size="19" font-family="sans-serif">768 MiB</text>
<text x="45" y="292" font-size="16" font-family="sans-serif">Reclaim call median</text><text x="780" y="292" fill="#9a4a00" font-size="19" font-family="sans-serif">0.22 ms</text>
<text x="45" y="340" font-size="16" font-family="sans-serif">Regrowth extra time vs paired control</text><text x="780" y="340" fill="#9a4a00" font-size="19" font-family="sans-serif">+1.59 ms</text>
<text x="36" y="410" font-size="12" font-family="sans-serif">All reductions are additional to ordinary purge; virtual reservation is not physical memory.</text>
<text x="36" y="432" font-size="11" font-family="sans-serif">Nonempty no-eligible: 3/3; active-worker pending: 3/3.</text>
</svg>
